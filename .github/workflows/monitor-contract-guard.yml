name: Monitor Contract Guard

# A trial's monitor keeps the code it started with for up to 12 hours while the
# API it reports to is redeployed, so /monitor requests and replies must remain
# compatible with older readers (oddish/src/oddish/mon/contract.py). This job runs the contract
# guard (backend/tests/test_monitor_contract.py, against the recorded snapshot),
# the /monitor route tests, and execution credential regression tests. No other
# workflow runs them. The real-Postgres proofs in oddish/tests/launcher are
# underscore-prefixed files that pytest does not collect.

on:
  # The monitor, the launcher, the /monitor routes and their tests, plus the
  # files the recorded contract is read from outside those (HarborOutcome,
  # live_tail.PersistResult), the scripts and queue modules the tests run or
  # inspect, and the dependency pins (Harbor's lifecycle events, FastAPI,
  # pydantic).
  pull_request:
    paths:
      - "oddish/src/oddish/mon/**"
      - "oddish/src/oddish/workers/launcher/**"
      - "oddish/src/oddish/workers/harbor/**"
      - "oddish/src/oddish/workers/agents/**"
      - "oddish/src/oddish/workers/queue/**"
      - "oddish/tests/test_setup_events.py"
      - "oddish/tests/test_worker_jobs_runner.py"
      - "oddish/src/oddish/config.py"
      - "oddish/src/oddish/schemas.py"
      - "oddish/src/oddish/harbor-pin.toml"
      - "oddish/scripts/mon-entrypoint.sh"
      - "oddish/scripts/mon-boot.sh"
      - "oddish/tests/mon/**"
      - "oddish/tests/launcher/**"
      - "oddish/tests/test_provider_startup.py"
      - "oddish/tests/test_verifier_credentials.py"
      - "oddish/tests/test_job_tokens.py"
      - "oddish/tests/test_judge_keys.py"
      - "oddish/tests/test_scoped_model_env_ambient.py"
      - "oddish/pyproject.toml"
      - "oddish/uv.lock"
      - "backend/api/routers/monitor.py"
      - "backend/scripts/monitor_contract.py"
      - "backend/tests/test_monitor_contract.py"
      - "backend/tests/test_monitor_endpoints.py"
      - "backend/tests/fixtures/monitor_contract.json"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/monitor-contract-guard.yml"
  # No main: it only fast-forwards to staging commits that already ran this.
  push:
    branches:
      - staging
    paths:
      - "oddish/src/oddish/mon/**"
      - "oddish/src/oddish/workers/launcher/**"
      - "oddish/src/oddish/workers/harbor/**"
      - "oddish/src/oddish/workers/agents/**"
      - "oddish/src/oddish/workers/queue/**"
      - "oddish/tests/test_setup_events.py"
      - "oddish/tests/test_worker_jobs_runner.py"
      - "oddish/src/oddish/config.py"
      - "oddish/src/oddish/schemas.py"
      - "oddish/src/oddish/harbor-pin.toml"
      - "oddish/scripts/mon-entrypoint.sh"
      - "oddish/scripts/mon-boot.sh"
      - "oddish/tests/mon/**"
      - "oddish/tests/launcher/**"
      - "oddish/tests/test_provider_startup.py"
      - "oddish/tests/test_verifier_credentials.py"
      - "oddish/tests/test_job_tokens.py"
      - "oddish/tests/test_judge_keys.py"
      - "oddish/tests/test_scoped_model_env_ambient.py"
      - "oddish/pyproject.toml"
      - "oddish/uv.lock"
      - "backend/api/routers/monitor.py"
      - "backend/scripts/monitor_contract.py"
      - "backend/tests/test_monitor_contract.py"
      - "backend/tests/test_monitor_endpoints.py"
      - "backend/tests/fixtures/monitor_contract.json"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/monitor-contract-guard.yml"

concurrency:
  group: monitor-contract-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # The staging push already tests this exact commit; promotion is fast-forward.
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref != 'main' || github.head_ref != 'staging' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Check /monitor formats and monitor tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # Python 3.13, uv, a warm uv cache, and pre-built backend and oddish venvs
    # live in the base image, refreshed weekly by ci-base-image.yml.
    container:
      image: ghcr.io/abundant-ai/oddish-ci-base-private:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      monitor-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oddish
          POSTGRES_PASSWORD: oddish
          POSTGRES_DB: oddish
        options: >-
          --health-cmd "pg_isready -U oddish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync backend dependencies
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
        run: uv sync --frozen

      - name: Run the /monitor contract guard and route tests
        working-directory: backend
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
        run: uv run pytest tests/test_monitor_contract.py tests/test_monitor_endpoints.py -q

      # The image's oddish venv has the server extra; the monitor and launcher
      # tests import the worker extra too (modal, thunder_sandbox).
      - name: Sync oddish dependencies
        working-directory: oddish
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/oddish
        run: uv sync --frozen --extra worker

      - name: Run monitor, launcher and credential regression tests
        working-directory: oddish
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/oddish
        run: >-
          uv run pytest tests/mon tests/launcher
          tests/test_provider_startup.py tests/test_verifier_credentials.py
          tests/test_job_tokens.py tests/test_judge_keys.py
          tests/test_scoped_model_env_ambient.py
          tests/test_setup_events.py tests/test_worker_jobs_runner.py -q

      # Run directly against a service so the lock regression cannot silently
      # skip when the job container has no Docker CLI/daemon.
      - name: Prove heartbeat renewal while a trial row is locked
        working-directory: oddish
        env:
          UV_PROJECT_ENVIRONMENT: /opt/venvs/oddish
          ODDISH_DATABASE_URL: postgresql+asyncpg://oddish:oddish@monitor-postgres:5432/oddish
        run: uv run python tests/launcher/proofs/_monitor_heartbeat_lock_proof.py
