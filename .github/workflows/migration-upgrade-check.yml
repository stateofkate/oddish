name: Migration Upgrade Check

# Pre-merge mirror of the migration steps in modal-deploy.yml, which run
# `alembic upgrade head` against PRODUCTION Supabase on push to main — so a migration
# that fails at the SQL/DDL level is only discovered after it is merged and
# already half-applied to prod. This job runs the identical upgrade against a
# throwaway Postgres at PR time, so the failure surfaces on the PR instead.
#
# Always-run + internal skip: there is intentionally NO `paths:` filter, so the
# workflow fires on every PR and can be marked a REQUIRED status check. A
# path-filtered workflow would never report a status on PRs that miss the paths,
# leaving a required check stuck "pending" and blocking merge forever. Instead
# the job always runs and the real work is gated on a `git diff` against the PR
# base — no migration changes → the job reports green immediately.

on:
  pull_request:

concurrency:
  group: migration-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ODDISH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so we can diff HEAD against the PR base commit.
          fetch-depth: 0

      # Fail closed. This required check once reported green on a PR that DID
      # change migrations: the base sha was not resolvable in the checkout, and
      # `git diff | grep` in the default shell (no pipefail) turned the failed
      # diff into empty grep input, which read as "no migration changes". A
      # base we cannot resolve must fail the check, never skip it.
      - name: Detect migration changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git cat-file -e "${base}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^(oddish|backend)/alembic/|^oddish/tests/(test_probe_removal_migration|test_exact_token_counts)\.py$|^oddish/src/oddish/(db/models|workers/harbor/live_tail_db|workers/queue/trial_handler|compare_token_costs|core/backfill_token_counts|core/cost_basis|core/task_browse_metrics|core/endpoints/task_open_queries|costs/verifier_cost)\.py$|^\.github/workflows/migration-upgrade-check\.yml$' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Migration files or upgrade workflow changed — running upgrade."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes — skipping upgrade (reports green)."
          fi

      - name: Set up Python and uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            oddish/uv.lock
            backend/uv.lock

      # A service container would start before change detection on every PR.
      - name: Start migration database
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run --detach --name migration-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=postgres postgres:16
          for _ in $(seq 1 50); do
            if docker exec migration-postgres pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs migration-postgres
          echo "::error::Migration database did not become ready within 50s."
          exit 1

      # Same order as prod: oddish migrations first (alembic_version), then
      # backend (alembic_version_backend), both against the one DB.
      - name: Sync oddish dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: oddish
        run: uv sync --frozen --extra server

      - name: Run oddish migrations
        if: steps.changes.outputs.run == 'true'
        working-directory: oddish
        run: uv run alembic upgrade head

      - name: Test probe migration with private rules and interrupted state
        if: steps.changes.outputs.run == 'true'
        working-directory: oddish
        run: ODDISH_TEST_DATABASE_URL="$ODDISH_DATABASE_URL" uv run pytest tests/test_probe_removal_migration.py -q

      - name: Test exact token counts with old workers and concurrent repairs
        if: steps.changes.outputs.run == 'true'
        working-directory: oddish
        run: ODDISH_TEST_DATABASE_URL="$ODDISH_DATABASE_URL" uv run pytest tests/test_exact_token_counts.py -q

      - name: Sync backend dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: uv sync --frozen

      - name: Run backend migrations
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Summarize migration run
        if: ${{ always() }}
        run: |
          {
            echo "## Migration upgrade check"
            echo
            if [ "${{ steps.changes.outputs.run }}" = "true" ]; then
              echo "- Requested \`alembic upgrade head\` against an ephemeral Postgres; see step results"
              echo "- Core migrations: \`oddish/alembic\` · Cloud: \`backend/alembic\`"
            elif [ "${{ steps.changes.outputs.run }}" = "false" ]; then
              echo "- Skipped: no migration changes in this PR"
            else
              echo "- Change detection failed; migration coverage is unknown"
            fi
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop migration database
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        run: docker rm --force migration-postgres || true
