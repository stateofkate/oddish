name: Preview Prune

# Open PRs keep their preview data at every age. Closed PR apps stop only
# after GKE teardown; their old Neon branches are deleted last. Unknown PR
# state keeps all resources. Legacy Supabase cleanup is manual only.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete Neon branches older than this many days only when their PR is closed"
        default: "7"
      dry_run:
        description: "Log what would be deleted/stopped without doing it"
        type: boolean
        default: false

concurrency:
  group: preview-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale preview branches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # The app sweep asks the REST API whether each app's PR is still open.
      pull-requests: read
    container:
      image: ghcr.io/abundant-ai/oddish-ci-base-private:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_AGE_DAYS: ${{ inputs.max_age_days || '7' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prune closed PR apps and old Neon branches
        run: "$GITHUB_WORKSPACE/.github/scripts/preview/prune_stale_preview_apps.sh"
