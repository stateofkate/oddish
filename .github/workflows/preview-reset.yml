name: Preview Reset
run-name: "Reset preview #${{ inputs.pr_number }}"

# Manual recovery for a broken preview database: deletes the PR's Neon
# branch and clones staging again on the PR's CURRENT
# merge ref, then updates the backend, frontend banner, and PR links.
#
# Rerunning a normal preview keeps its database. This workflow does an
# explicit reset, on a fresh checkout of refs/pull/<N>/merge.
#
# Shares pr-preview's per-PR concurrency group so a reset never races a
# preview run; cancel-in-progress stays false so a reset queues behind an
# in-flight run (a new push may still cancel a queued reset -- correct
# precedence). Normal pushes never reset the database.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose Neon preview data is deleted and replaced with staging"
        required: true

concurrency:
  group: pr-preview-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  reset:
    name: Reset preview database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
    container:
      image: ghcr.io/abundant-ai/oddish-ci-base-private:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: preview
      MODAL_APP_NAME: oddish-pr-${{ inputs.pr_number }}
      MODAL_SECRET_ENVIRONMENT: main
      EXPECTED_MODAL_API_URL: https://abundant-ai-preview--oddish-pr-${{ inputs.pr_number }}-api.modal.run
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PREVIEW_ALIAS_HOSTNAME: pr-${{ inputs.pr_number }}.oddish.app
      UV_PROJECT_ENVIRONMENT: /opt/venvs/backend
      # Read only organization approval decisions, without a data refresh.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PREVIEW_SAMPLE_SOURCE_DB_URL: ${{ secrets.ODDISH_DATABASE_URL }}
      # GKE parity with pr-preview.yml: a reset must redeploy the same
      # preview it replaces, so the ODDISH_* env of the two deploy jobs
      # must stay identical. pr-preview.yml documents why previews carry a
      # real GKE backend.
      ODDISH_GKE_ENABLED: "true"
      ODDISH_GKE_PROJECT_ID: "abundant-default"
      ODDISH_GKE_REGION: "us-east5"
      ODDISH_GKE_REGISTRY_LOCATION: "us-east5"
      ODDISH_GKE_REGISTRY_NAME: "oddish-envs"
      ODDISH_GKE_AUTO_PROVISION_CLUSTER: "true"
      ODDISH_GKE_AUTO_BUILD_MISSING_IMAGE: "true"
      ODDISH_NUMINOUS_ENABLED: "1"
      ODDISH_MODAL_API_MIN_CONTAINERS: "0"
      ODDISH_MODAL_API_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_API_MAX_CONTAINERS: "2"
      ODDISH_MODAL_WORKER_MIN_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_BUFFER_CONTAINERS: "0"
      ODDISH_MODAL_WORKER_MAX_CONTAINERS: "400"
      ODDISH_MODAL_MAX_WORKERS_PER_POLL: "400"
      # Thunder Compute Configs
      ODDISH_THUNDER_ENABLED: "true"
      ODDISH_THUNDER_SECRET_NAME: "oddish-thunder"
      ODDISH_THUNDER_MAX_CAPACITY: "128"
      # Let one model fill the preview worker pool during load tests.
      ODDISH_DEFAULT_MODEL_CONCURRENCY: "300"
      ODDISH_MODEL_CONCURRENCY_OVERRIDES: "{}"
      ODDISH_GATE_LLM_ON_BASELINES: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
    defaults:
      run:
        working-directory: backend
    steps:
      # SECURITY: this workflow checks out and runs PR code with repo secrets,
      # so it must enforce the same same-repo guard as pr-preview.yml BEFORE
      # any PR code is fetched. Fork PRs and closed PRs are rejected here.
      - name: Require an open same-repo PR
        working-directory: ${{ github.workspace }}
        # Container jobs default to sh (dash), which rejects `set -o pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?}"
          : "${VERCEL_ORG_ID:?}"
          : "${VERCEL_PROJECT_ID:?}"
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR number must be a positive whole number."
            exit 1
          fi
          pr_json=$(curl -sSf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
          state=$(printf '%s' "$pr_json" | jq -r '.state')
          head_ref=$(printf '%s' "$pr_json" | jq -r '.head.ref')
          if [ "$head_ref" = main ] || [ "$head_ref" = staging ]; then
            echo "::error::Main and staging do not have a PR database."
            exit 1
          fi
          head_repo=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')
          if [ "$state" != "open" ] || [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "::error::PR #$PR_NUMBER is not an open same-repo PR (state=$state, head=$head_repo); refusing to reset."
            exit 1
          fi
          # Titles can contain newlines. Keep each value inside its own random
          # delimiter so PR text cannot add environment variables.
          export PR_METADATA_JSON
          PR_METADATA_JSON=$(printf '%s' "$pr_json" | jq -c '{
            VERCEL_GIT_BRANCH: .head.ref,
            VERCEL_GIT_COMMIT_SHA: .head.sha,
            PREVIEW_COMMIT_SHA: .head.sha,
            PR_URL: .html_url,
            PR_TITLE: .title
          }')
          python - <<'PY'
          import json
          import os
          import uuid

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for key, value in json.loads(os.environ["PR_METADATA_JSON"]).items():
                  delimiter = f"oddish_{uuid.uuid4().hex}"
                  env_file.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Checkout PR merge ref
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Stop preview backend before reset
        run: "$GITHUB_WORKSPACE/.github/scripts/preview/stop_modal_preview_app.sh"

      - name: Delete Neon preview branch
        run: "$GITHUB_WORKSPACE/.github/scripts/preview/reset_preview_branch.sh"

      - name: Rebuild preview database
        id: database
        env:
          ARCHIL_PREVIEW_CONFIG: ${{ secrets[format('ARCHIL_PREVIEW_{0}', inputs.pr_number)] }}
        run: "$GITHUB_WORKSPACE/.github/scripts/preview/prepare_preview_database.sh"

      - name: Deploy preview backend
        id: backend
        run: "$GITHUB_WORKSPACE/.github/scripts/preview/deploy_preview_backend.sh"

      - name: Update Vercel preview
        id: vercel
        env:
          MODAL_API_URL: ${{ steps.backend.outputs.modal_api_url }}
          NEON_BRANCH_ID: ${{ steps.database.outputs.branch_id }}
        run: "$GITHUB_WORKSPACE/.github/scripts/preview/update_vercel_preview.sh"

      - name: Post preview links
        env:
          VERCEL_PREVIEW_URL: ${{ steps.vercel.outputs.preview_alias_url || steps.vercel.outputs.preview_url }}
          VERCEL_DEPLOYMENT_URL: ${{ steps.vercel.outputs.preview_url }}
          MODAL_API_URL: ${{ steps.backend.outputs.modal_api_url }}
          PREVIEW_BACKEND_LABEL: ${{ steps.vercel.outputs.backend_label }}
          PREVIEW_DATABASE_LABEL: ${{ steps.vercel.outputs.database_label }}
          NEON_BRANCH_ID: ${{ steps.database.outputs.branch_id }}
        run: python "$GITHUB_WORKSPACE/.github/scripts/preview/post_preview_links.py"
