<svg width="1000" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" style="min-width:860px"><style>:root{
  --bg:#fbfcf9; --surface:#ffffff; --surface-2:#eef1f1; --line:#e4e8dc; --ink:#20261d; --ink-soft:#4c5a59; --ink-faint:#7b8786;
  --accent:#1f6f78; --sweep:#6a4bb0; --ok:#1d7a46; --warn:#9a6200; --bad:#a8322f;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px; --radius:6px;
}@media (prefers-color-scheme:dark){:root{
  --bg:#131611; --surface:#1a1e17; --surface-2:#1d2626; --line:#2e3528; --ink:#e9ede3; --ink-soft:#a9b6b5; --ink-faint:#74807f;
  --accent:#6fc3cc; --sweep:#b9a2f5; --ok:#5fcf8c; --warn:#e0a64a; --bad:#f08a86;}}text{font-family:system-ui,sans-serif}</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent)" stroke-width="1.6"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--bad)" stroke-width="1.6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ok)" stroke-width="1.6"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--warn)" stroke-width="1.6"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--sweep)" stroke-width="1.6"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="1.6"/></marker><marker id="m-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"/></marker><filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="470"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs><g fill="currentColor"><rect x="20" y="30" width="200" height="70" stroke="var(--sweep)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="30" y="49" font-size="13" font-weight="700" fill="var(--sweep)">Reconciler sweep</text><text x="30" y="67" font-size="11.5" fill="currentColor">monitor-owned attempt,</text><text x="30" y="82" font-size="11.5" fill="currentColor">heartbeat older than 15 min</text><rect x="270" y="30" width="210" height="70" stroke="var(--warn)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="280" y="49" font-size="13" font-weight="700" fill="var(--warn)">Result already accepted?</text><text x="280" y="67" font-size="11.5" fill="currentColor">(payload + refs durable)</text><rect x="270" y="150" width="210" height="70" stroke="var(--warn)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="280" y="169" font-size="13" font-weight="700" fill="var(--warn)">Re-drive settle</text><text x="280" y="187" font-size="11.5" fill="currentColor">bounded tries, then failure</text><text x="280" y="202" font-size="11.5" fill="currentColor">settlement. Trial never re-run.</text><rect x="530" y="30" width="220" height="70" stroke="var(--sweep)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="540" y="49" font-size="13" font-weight="700" fill="var(--sweep)">Check monitor status</text><text x="540" y="67" font-size="11.5" fill="currentColor">provider exec `oddish-mon status`</text><text x="540" y="82" font-size="11.5" fill="currentColor">up to 3 tries, short timeout</text><rect x="800" y="20" width="185" height="62" stroke="var(--ok)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="810" y="39" font-size="13" font-weight="700" fill="var(--ok)">ALIVE</text><text x="810" y="57" font-size="11.5" fill="currentColor">monitor answers:</text><text x="810" y="72" font-size="11.5" fill="currentColor">keep attempt, reset count</text><rect x="800" y="96" width="185" height="76" stroke="currentColor" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="810" y="115" font-size="13" font-weight="700" fill="currentColor">UNKNOWN</text><text x="810" y="133" font-size="11.5" fill="currentColor">provider / API unreachable:</text><text x="810" y="148" font-size="11.5" fill="currentColor">keep attempt, next sweep.</text><text x="810" y="163" font-size="11.5" fill="currentColor">Never inferred dead.</text><rect x="800" y="186" width="185" height="92" stroke="var(--bad)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="810" y="205" font-size="13" font-weight="700" fill="var(--bad)">UNRESPONSIVE</text><text x="810" y="223" font-size="11.5" fill="currentColor">provider says sandbox is</text><text x="810" y="238" font-size="11.5" fill="currentColor">running, status times out</text><text x="810" y="253" font-size="11.5" fill="currentColor">in 3 sweeps running:</text><text x="810" y="268" font-size="11.5" fill="currentColor">terminate (explicit policy)</text><rect x="530" y="300" width="220" height="92" stroke="var(--bad)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="540" y="319" font-size="13" font-weight="700" fill="var(--bad)">CONFIRMED GONE</text><text x="540" y="337" font-size="11.5" fill="currentColor">exec works, monitor exited, or</text><text x="540" y="352" font-size="11.5" fill="currentColor">provider says sandbox ended.</text><text x="540" y="367" font-size="11.5" fill="currentColor">recheck ownership + heartbeat</text><text x="540" y="382" font-size="11.5" fill="currentColor">in one statement, then:</text><rect x="800" y="300" width="185" height="122" stroke="var(--bad)" stroke-width="2" fill="var(--surface-2)" rx="10" filter="url(#rough)"/><text x="810" y="319" font-size="13" font-weight="700" fill="var(--bad)">Existing path</text><text x="810" y="337" font-size="11.5" fill="currentColor">reap -&gt; retry or fail</text><text x="810" y="352" font-size="11.5" fill="currentColor">mirror to trial</text><text x="810" y="367" font-size="11.5" fill="currentColor">release slot + lease</text><text x="810" y="382" font-size="11.5" fill="currentColor">revoke token</text><text x="810" y="397" font-size="11.5" fill="currentColor">tear down sandbox</text><rect x="20" y="356" width="460" height="98" stroke="var(--sweep)" stroke-width="2" fill="var(--surface-2)" rx="10" filter="url(#rough)"/><text x="30" y="375" font-size="13" font-weight="700" fill="var(--sweep)">Attempt deadline (the bound the old worker's 12 h timeout gave)</text><text x="30" y="393" font-size="11.5" fill="currentColor">claimed_at + 12 h, enforced by the sweep and by the monitor itself.</text><text x="30" y="408" font-size="11.5" fill="currentColor">UNKNOWN and settle re-drives end here: existing fail + teardown.</text><text x="30" y="423" font-size="11.5" fill="currentColor">Finalization included, so the slot is always freed inside its 12 h + 30 s lease.</text><path d="M220 65 L270 65" fill="none" stroke="var(--sweep)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-purple)"/><path d="M375 100 L375 150" fill="none" stroke="var(--warn)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-amber)"/><text x="385" y="130" font-size="11" text-anchor="start" fill="var(--warn)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">yes</text><path d="M480 65 L530 65" fill="none" stroke="var(--sweep)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-purple)"/><text x="505" y="55" font-size="11" text-anchor="middle" fill="var(--sweep)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">no</text><line x1="775" y1="50" x2="775" y2="232" stroke="var(--ink-soft)" stroke-width="1.2"/><path d="M750 50 L800 50" fill="none" stroke="var(--ok)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-green)"/><path d="M775 134 L800 134" fill="none" stroke="currentColor" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-ink)"/><path d="M775 232 L800 232" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><path d="M640 100 L640 300" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><text x="650" y="200" font-size="11" text-anchor="start" fill="var(--bad)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">status says gone</text><path d="M750 346 L800 346" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><path d="M892 278 L892 300" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><text x="20" y="150" font-size="11.5" text-anchor="start" fill="var(--ink-soft)">Unchanged: threshold, sweep cadence,</text><text x="20" y="166" font-size="11.5" text-anchor="start" fill="var(--ink-soft)">reap, retry rules, teardown, 12 h bound.</text><text x="20" y="196" font-size="11.5" text-anchor="start" fill="var(--sweep)">New: the status check and the</text><text x="20" y="212" font-size="11.5" text-anchor="start" fill="var(--sweep)">accepted-result branch.</text><text x="20" y="246" font-size="11.5" text-anchor="start" fill="var(--ink-soft)">Pooler-incident shape: every beat fails,</text><text x="20" y="262" font-size="11.5" text-anchor="start" fill="var(--ink-soft)">every monitor answers -&gt; nothing reaped.</text><text x="20" y="296" font-size="11.5" text-anchor="start" fill="var(--ink-soft)">Not in scope: restarting the monitor</text><text x="20" y="312" font-size="11.5" text-anchor="start" fill="var(--ink-soft)">or resuming a trial.</text></g></svg>