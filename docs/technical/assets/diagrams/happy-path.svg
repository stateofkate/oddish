<svg width="1000" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" style="min-width:860px"><style>:root{
  --bg:#fbfcf9; --surface:#ffffff; --surface-2:#eef1f1; --line:#e4e8dc; --ink:#20261d; --ink-soft:#4c5a59; --ink-faint:#7b8786;
  --accent:#1f6f78; --sweep:#6a4bb0; --ok:#1d7a46; --warn:#9a6200; --bad:#a8322f;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px; --radius:6px;
}@media (prefers-color-scheme:dark){:root{
  --bg:#131611; --surface:#1a1e17; --surface-2:#1d2626; --line:#2e3528; --ink:#e9ede3; --ink-soft:#a9b6b5; --ink-faint:#74807f;
  --accent:#6fc3cc; --sweep:#b9a2f5; --ok:#5fcf8c; --warn:#e0a64a; --bad:#f08a86;}}text{font-family:system-ui,sans-serif}</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent)" stroke-width="1.6"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--bad)" stroke-width="1.6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ok)" stroke-width="1.6"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--warn)" stroke-width="1.6"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--sweep)" stroke-width="1.6"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="1.6"/></marker><marker id="m-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"/></marker><filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs><g fill="currentColor"><rect x="6" y="14" width="112" height="30" stroke="currentColor" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="16" y="33" font-size="11.5" font-weight="700" fill="currentColor">Dispatcher</text><line x1="62" y1="44" x2="62" y2="625" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="134" y="14" width="112" height="30" stroke="var(--accent)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="144" y="33" font-size="11.5" font-weight="700" fill="var(--accent)">Launcher</text><line x1="190" y1="44" x2="190" y2="625" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="289" y="14" width="112" height="30" stroke="currentColor" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="299" y="33" font-size="11.5" font-weight="700" fill="currentColor">API + Postgres</text><line x1="345" y1="44" x2="345" y2="625" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="444" y="14" width="112" height="30" stroke="var(--accent)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="454" y="33" font-size="11.5" font-weight="700" fill="var(--accent)">Builder/Registry</text><line x1="500" y1="44" x2="500" y2="625" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="594" y="14" width="112" height="30" stroke="var(--ok)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="604" y="33" font-size="11.5" font-weight="700" fill="var(--ok)">oddish-mon</text><line x1="650" y1="44" x2="650" y2="625" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="744" y="14" width="112" height="30" stroke="currentColor" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="754" y="33" font-size="11.5" font-weight="700" fill="currentColor">Task container</text><line x1="800" y1="44" x2="800" y2="625" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="879" y="14" width="112" height="30" stroke="var(--warn)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="889" y="33" font-size="11.5" font-weight="700" fill="var(--warn)">Settle</text><line x1="935" y1="44" x2="935" y2="625" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M62 70 L190 70" fill="none" stroke="currentColor" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-ink)"/><circle cx="62" cy="70" r="9" fill="var(--surface)" stroke="currentColor" stroke-width="1.6"/><text x="62" y="74" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor">1</text><text x="78" y="62" font-size="11" text-anchor="start" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">spawn for one queued trial</text><path d="M190 113 L345 113" fill="none" stroke="var(--accent)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-blue)"/><circle cx="190" cy="113" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/><text x="190" y="117" font-size="11" font-weight="700" text-anchor="middle" fill="var(--accent)">2</text><text x="206" y="105" font-size="11" text-anchor="start" fill="var(--accent)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">lease slot, claim job, prepare attempt</text><path d="M190 156 L500 156" fill="none" stroke="var(--accent)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-blue)"/><circle cx="190" cy="156" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/><text x="190" y="160" font-size="11" font-weight="700" text-anchor="middle" fill="var(--accent)">3</text><text x="206" y="148" font-size="11" text-anchor="start" fill="var(--accent)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">ensure_task_image -&gt; image digest</text><path d="M190 199 L345 199" fill="none" stroke="var(--accent)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-blue)"/><circle cx="190" cy="199" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/><text x="190" y="203" font-size="11" font-weight="700" text-anchor="middle" fill="var(--accent)">4</text><text x="206" y="191" font-size="11" text-anchor="start" fill="var(--accent)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">persist handoff values, mint monitor token</text><path d="M190 242 L650 242" fill="none" stroke="var(--accent)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-blue)"/><circle cx="190" cy="242" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/><text x="190" y="246" font-size="11" font-weight="700" text-anchor="middle" fill="var(--accent)">5</text><text x="206" y="234" font-size="11" text-anchor="start" fill="var(--accent)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">create sandbox, pass token + config; persist handle</text><path d="M650 285 L345 285" fill="none" stroke="var(--ok)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-green)"/><circle cx="650" cy="285" r="9" fill="var(--surface)" stroke="var(--ok)" stroke-width="1.6"/><text x="650" y="289" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ok)">6</text><text x="361" y="277" font-size="11" text-anchor="start" fill="var(--ok)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">ACK with monitor token (launcher beats don't count)</text><path d="M190 328 L345 328" fill="none" stroke="var(--accent)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-blue)"/><circle cx="190" cy="328" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/><text x="190" y="332" font-size="11" font-weight="700" text-anchor="middle" fill="var(--accent)">7</text><text x="206" y="320" font-size="11" text-anchor="start" fill="var(--accent)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">outcome = HANDED OFF: job RUNNING, slot kept. Launcher exits</text><path d="M650 371 L500 371" fill="none" stroke="var(--ok)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-green)"/><circle cx="650" cy="371" r="9" fill="var(--surface)" stroke="var(--ok)" stroke-width="1.6"/><text x="650" y="375" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ok)">8</text><text x="516" y="363" font-size="11" text-anchor="start" fill="var(--ok)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">dockerd pulls the image (no build)</text><path d="M650 414 L800 414" fill="none" stroke="var(--ok)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-green)"/><circle cx="650" cy="414" r="9" fill="var(--surface)" stroke="var(--ok)" stroke-width="1.6"/><text x="650" y="418" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ok)">9</text><text x="666" y="406" font-size="11" text-anchor="start" fill="var(--ok)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Harbor: install agent, run agent, run verifier</text><path d="M650 457 L345 457" fill="none" stroke="var(--ok)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-green)"/><circle cx="650" cy="457" r="9" fill="var(--surface)" stroke="var(--ok)" stroke-width="1.6"/><text x="650" y="461" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ok)">10</text><text x="361" y="449" font-size="11" text-anchor="start" fill="var(--ok)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">heartbeat 30 s · control 15 s · stage + live events</text><path d="M650 500 L345 500" fill="none" stroke="var(--ok)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-green)"/><circle cx="650" cy="500" r="9" fill="var(--surface)" stroke="var(--ok)" stroke-width="1.6"/><text x="650" y="504" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ok)">11</text><text x="361" y="492" font-size="11" text-anchor="start" fill="var(--ok)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">upload archive to S3, then POST result (payload + refs durable)</text><path d="M345 543 L935 543" fill="none" stroke="var(--warn)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-amber)"/><circle cx="345" cy="543" r="9" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.6"/><text x="345" y="547" font-size="11" font-weight="700" text-anchor="middle" fill="var(--warn)">12</text><text x="361" y="535" font-size="11" text-anchor="start" fill="var(--warn)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">spawn settle</text><path d="M935 586 L345 586" fill="none" stroke="var(--warn)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-amber)"/><circle cx="935" cy="586" r="9" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.6"/><text x="935" y="590" font-size="11" font-weight="700" text-anchor="middle" fill="var(--warn)">13</text><text x="361" y="578" font-size="11" text-anchor="start" fill="var(--warn)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">trial + job outcome, costs, hooks, revoke token, release slot</text></g></svg>