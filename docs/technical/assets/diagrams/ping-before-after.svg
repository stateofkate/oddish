<svg width="960" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" style="min-width:860px"><style>:root{
  --bg:#fbfcf9; --surface:#ffffff; --surface-2:#eef1f1; --line:#e4e8dc; --ink:#20261d; --ink-soft:#4c5a59; --ink-faint:#7b8786;
  --accent:#1f6f78; --sweep:#6a4bb0; --ok:#1d7a46; --warn:#9a6200; --bad:#a8322f;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px; --radius:6px;
}@media (prefers-color-scheme:dark){:root{
  --bg:#131611; --surface:#1a1e17; --surface-2:#1d2626; --line:#2e3528; --ink:#e9ede3; --ink-soft:#a9b6b5; --ink-faint:#74807f;
  --accent:#6fc3cc; --sweep:#b9a2f5; --ok:#5fcf8c; --warn:#e0a64a; --bad:#f08a86;}}text{font-family:system-ui,sans-serif}</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent)" stroke-width="1.6"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--bad)" stroke-width="1.6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ok)" stroke-width="1.6"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--warn)" stroke-width="1.6"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--sweep)" stroke-width="1.6"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="1.6"/></marker><marker id="m-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"/></marker><filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs><g fill="currentColor"><text x="20" y="20" font-size="18" text-anchor="start" fill="currentColor" font-weight="700">Restricted-network task: ping and the bypass, before and after harbor#74</text><text x="20" y="40" font-size="17" text-anchor="start" fill="currentColor" font-weight="700">BEFORE  (Docker default privileges)</text><rect x="20" y="60" width="440" height="330" stroke="var(--ink-soft)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="30" y="79" font-size="13" font-weight="700" fill="var(--ink-soft)">Monitor sandbox (Modal VM or Daytona container)</text><rect x="35" y="100" width="195" height="80" stroke="var(--ok)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="45" y="119" font-size="13" font-weight="700" fill="var(--ok)">oddish-mon</text><text x="45" y="137" font-size="11.5" fill="currentColor">own network, untouched</text><text x="45" y="152" font-size="11.5" fill="currentColor">heartbeats: 0 failed</text><rect x="250" y="100" width="195" height="80" stroke="var(--sweep)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="260" y="119" font-size="13" font-weight="700" fill="var(--sweep)">Harbor egress sidecar</text><text x="260" y="137" font-size="11.5" fill="currentColor">holds NET_ADMIN</text><text x="260" y="152" font-size="11.5" fill="currentColor">nftables: block, allow mark</text><rect x="35" y="215" width="410" height="160" stroke="var(--bad)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="45" y="234" font-size="13" font-weight="700" fill="var(--bad)">Task container (shares the sidecar's network)</text><text x="45" y="252" font-size="11.5" fill="currentColor">privileges: NET_RAW present</text><text x="45" y="267" font-size="11.5" fill="currentColor">web, API, direct DNS: blocked</text><text x="45" y="282" font-size="11.5" fill="currentColor">ping 1.1.1.1: REPLIED</text><text x="45" y="297" font-size="11.5" fill="currentColor">socket mark 114514: accepted -&gt; internet reached</text><text x="45" y="312" font-size="11.5" fill="currentColor">  = the no-network policy can be bypassed</text><path d="M347 215 L347 180" fill="none" stroke="var(--sweep)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-purple)"/><text x="20" y="412" font-size="12" text-anchor="start" fill="var(--ink-soft)">Measured on Modal and Daytona, 21 Sep.</text><text x="500" y="40" font-size="17" text-anchor="start" fill="currentColor" font-weight="700">AFTER  (harbor#74: NET_RAW, NET_ADMIN dropped)</text><rect x="500" y="60" width="440" height="330" stroke="var(--ink-soft)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="510" y="79" font-size="13" font-weight="700" fill="var(--ink-soft)">Monitor sandbox (Modal VM or Daytona container)</text><rect x="515" y="100" width="195" height="80" stroke="var(--ok)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="525" y="119" font-size="13" font-weight="700" fill="var(--ok)">oddish-mon</text><text x="525" y="137" font-size="11.5" fill="currentColor">own network, untouched</text><text x="525" y="152" font-size="11.5" fill="currentColor">heartbeats: 0 failed</text><rect x="730" y="100" width="195" height="80" stroke="var(--sweep)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="740" y="119" font-size="13" font-weight="700" fill="var(--sweep)">Harbor egress sidecar</text><text x="740" y="137" font-size="11.5" fill="currentColor">holds NET_ADMIN</text><text x="740" y="152" font-size="11.5" fill="currentColor">nftables: block, allow mark</text><rect x="515" y="215" width="410" height="160" stroke="var(--ok)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="525" y="234" font-size="13" font-weight="700" fill="var(--ok)">Task container (shares the sidecar's network)</text><text x="525" y="252" font-size="11.5" fill="currentColor">privileges: NET_RAW removed</text><text x="525" y="267" font-size="11.5" fill="currentColor">web, API, direct DNS: blocked</text><text x="525" y="282" font-size="11.5" fill="currentColor">ping: 'Operation not permitted' (will not start)</text><text x="525" y="297" font-size="11.5" fill="currentColor">socket mark 114514: Operation not permitted</text><text x="525" y="312" font-size="11.5" fill="currentColor">  = bypass closed</text><path d="M827 215 L827 180" fill="none" stroke="var(--sweep)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-purple)"/><text x="500" y="412" font-size="12" text-anchor="start" fill="var(--ink-soft)">Same result on Modal and Daytona.</text><text x="20" y="450" font-size="14" text-anchor="start" fill="currentColor" font-weight="700">Why ping stops (measured, not the firewall):</text><rect x="20" y="465" width="300" height="150" stroke="var(--warn)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="30" y="484" font-size="13" font-weight="700" fill="var(--warn)">1. The ping program itself</text><text x="30" y="502" font-size="11.5" fill="currentColor">Ubuntu installs /usr/bin/ping with the</text><text x="30" y="517" font-size="11.5" fill="currentColor">NET_RAW privilege attached to the file.</text><text x="30" y="532" font-size="11.5" fill="currentColor">A container forbidden NET_RAW may not</text><text x="30" y="547" font-size="11.5" fill="currentColor">run it at all: exit 126, no packet sent.</text><rect x="335" y="465" width="300" height="150" stroke="var(--warn)" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="345" y="484" font-size="13" font-weight="700" fill="var(--warn)">2. Unprivileged ping (no NET_RAW)</text><text x="345" y="502" font-size="11.5" fill="currentColor">Kernel setting ping_group_range decides.</text><text x="345" y="517" font-size="11.5" fill="currentColor">Modal: open -&gt; a plain copy of ping REPLIED.</text><text x="345" y="532" font-size="11.5" fill="currentColor">Daytona: closed (65534 65534) -&gt; refused,</text><text x="345" y="547" font-size="11.5" fill="currentColor">and Compose cannot change it there.</text><rect x="650" y="465" width="290" height="150" stroke="currentColor" stroke-width="2" fill="none" rx="10" filter="url(#rough)"/><text x="660" y="484" font-size="13" font-weight="700" fill="currentColor">What else needs NET_RAW</text><text x="660" y="502" font-size="11.5" fill="currentColor">traceroute, arping, tcpdump / packet</text><text x="660" y="517" font-size="11.5" fill="currentColor">capture, raw-socket scanners.</text><text x="660" y="532" font-size="11.5" fill="currentColor">Only in restricted-network tasks.</text><text x="660" y="547" font-size="11.5" fill="currentColor">Public-network tasks are untouched.</text></g></svg>