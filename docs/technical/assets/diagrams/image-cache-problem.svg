<svg width="1200" height="760" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><rect width="100%" height="100%" fill="#ffffff"/><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fafafa"/>
  <text x="600" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Dockerfile-only tasks: where Modal's image cache lives, and where the plan loses it</text>

  <!-- ===== Panel 1: Today ===== -->
  <g transform="translate(20,55)">
    <rect width="270" height="330" rx="8" fill="#fff" stroke="#bbb"/>
    <text x="135" y="24" text-anchor="middle" font-weight="600" fill="#222">1. Today</text>
    <text x="135" y="42" text-anchor="middle" fill="#666" font-size="11">sandbox = task container</text>

    <rect x="15" y="60" width="240" height="70" rx="6" fill="#eef3ff" stroke="#6b8cff"/>
    <text x="135" y="80" text-anchor="middle" font-weight="600" fill="#2b4bb3">Provider image builder</text>
    <text x="135" y="98" text-anchor="middle" fill="#333">Dockerfile -> image</text>
    <text x="135" y="116" text-anchor="middle" fill="#1b7f3b" font-weight="600">cache HIT after trial 1</text>

    <line x1="135" y1="130" x2="135" y2="158" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="15" y="160" width="240" height="90" rx="6" fill="#fff8e6" stroke="#e0a800"/>
    <text x="135" y="180" text-anchor="middle" font-weight="600" fill="#8a6d00">Provider sandbox</text>
    <text x="135" y="200" text-anchor="middle" fill="#333">IS the task container</text>
    <text x="135" y="218" text-anchor="middle" fill="#333">agent + verifier run here</text>
    <text x="135" y="236" text-anchor="middle" fill="#666" font-size="11">no dockerd inside</text>

    <rect x="15" y="270" width="240" height="46" rx="6" fill="#fdecec" stroke="#c0392b"/>
    <text x="135" y="289" text-anchor="middle" font-weight="600" fill="#a02020">Worker (3x, to be deleted)</text>
    <text x="135" y="306" text-anchor="middle" fill="#333" font-size="11">drives Harbor via exec API</text>
    <line x1="135" y1="270" x2="135" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Panel 2: Plan as written ===== -->
  <g transform="translate(320,55)">
    <rect width="270" height="330" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="135" y="24" text-anchor="middle" font-weight="600" fill="#a02020">2. Plan as written (breaks)</text>
    <text x="135" y="42" text-anchor="middle" fill="#666" font-size="11">oddish-mon on VM, task in docker below</text>

    <rect x="15" y="60" width="240" height="46" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-dasharray="4 3"/>
    <text x="135" y="80" text-anchor="middle" fill="#888">Provider image builder</text>
    <text x="135" y="97" text-anchor="middle" fill="#c0392b" font-weight="600">never sees the task Dockerfile</text>

    <rect x="15" y="120" width="240" height="196" rx="6" fill="#fff8e6" stroke="#e0a800"/>
    <text x="135" y="140" text-anchor="middle" font-weight="600" fill="#8a6d00">Provider sandbox (dind)</text>
    <text x="135" y="157" text-anchor="middle" fill="#333" font-size="11">image = generic monitor VM</text>

    <rect x="30" y="168" width="210" height="34" rx="5" fill="#e8f7ee" stroke="#1b7f3b"/>
    <text x="135" y="190" text-anchor="middle" fill="#1b7f3b" font-weight="600">oddish-mon (entrypoint)</text>

    <line x1="135" y1="202" x2="135" y2="216" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowred)"/>
    <text x="150" y="214" fill="#c0392b" font-size="11">docker build</text>

    <rect x="30" y="218" width="210" height="40" rx="5" fill="#fdecec" stroke="#c0392b"/>
    <text x="135" y="234" text-anchor="middle" fill="#a02020" font-weight="600">inner dockerd</text>
    <text x="135" y="250" text-anchor="middle" fill="#a02020" font-size="11">fresh daemon, EMPTY cache, every trial</text>

    <line x1="135" y1="258" x2="135" y2="272" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="30" y="274" width="210" height="32" rx="5" fill="#fff" stroke="#999"/>
    <text x="135" y="295" text-anchor="middle" fill="#333">task container (agent, verifier)</text>
  </g>

  <!-- ===== Panel 3: Option A ===== -->
  <g transform="translate(620,55)">
    <rect width="270" height="330" rx="8" fill="#fff" stroke="#1b7f3b" stroke-width="2"/>
    <text x="135" y="24" text-anchor="middle" font-weight="600" fill="#1b7f3b">3. Option A: layer monitor in</text>
    <text x="135" y="42" text-anchor="middle" fill="#666" font-size="11">keep sandbox = task container</text>

    <rect x="15" y="60" width="240" height="70" rx="6" fill="#eef3ff" stroke="#6b8cff"/>
    <text x="135" y="80" text-anchor="middle" font-weight="600" fill="#2b4bb3">Provider image builder</text>
    <text x="135" y="98" text-anchor="middle" fill="#333">Dockerfile + one extra layer</text>
    <text x="135" y="116" text-anchor="middle" fill="#1b7f3b" font-weight="600">cache HIT, both layers</text>

    <line x1="135" y1="130" x2="135" y2="158" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="15" y="160" width="240" height="156" rx="6" fill="#fff8e6" stroke="#e0a800"/>
    <text x="135" y="180" text-anchor="middle" font-weight="600" fill="#8a6d00">Provider sandbox = task container</text>
    <rect x="30" y="192" width="210" height="34" rx="5" fill="#e8f7ee" stroke="#1b7f3b"/>
    <text x="135" y="214" text-anchor="middle" fill="#1b7f3b" font-weight="600">oddish-mon (entrypoint, PID 1)</text>
    <line x1="135" y1="226" x2="135" y2="240" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="150" y="238" fill="#555" font-size="11">subprocess, no docker</text>
    <rect x="30" y="242" width="210" height="32" rx="5" fill="#fff" stroke="#999"/>
    <text x="135" y="263" text-anchor="middle" fill="#333">agent, verifier (same container)</text>
    <text x="135" y="296" text-anchor="middle" fill="#666" font-size="11">no dockerd. Harbor needs a "local exec" env</text>
    <text x="135" y="309" text-anchor="middle" fill="#666" font-size="11">monitor shares a container with the agent</text>
  </g>

  <!-- ===== Panel 4: Option B ===== -->
  <g transform="translate(920,55)">
    <rect width="260" height="330" rx="8" fill="#fff" stroke="#1b7f3b" stroke-width="2"/>
    <text x="130" y="24" text-anchor="middle" font-weight="600" fill="#1b7f3b">4. Option B: prebuilt pull</text>
    <text x="130" y="42" text-anchor="middle" fill="#666" font-size="11">DinD for everything, pull not build</text>

    <rect x="15" y="60" width="230" height="70" rx="6" fill="#eef3ff" stroke="#6b8cff"/>
    <text x="130" y="80" text-anchor="middle" font-weight="600" fill="#2b4bb3">Build pipeline (NEW)</text>
    <text x="130" y="98" text-anchor="middle" fill="#333">build once per task version</text>
    <text x="130" y="116" text-anchor="middle" fill="#333">push to registry</text>

    <line x1="130" y1="130" x2="130" y2="158" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="15" y="160" width="230" height="156" rx="6" fill="#fff8e6" stroke="#e0a800"/>
    <text x="130" y="180" text-anchor="middle" font-weight="600" fill="#8a6d00">Provider sandbox (dind)</text>
    <rect x="30" y="192" width="200" height="30" rx="5" fill="#e8f7ee" stroke="#1b7f3b"/>
    <text x="130" y="212" text-anchor="middle" fill="#1b7f3b" font-weight="600">oddish-mon</text>
    <line x1="130" y1="222" x2="130" y2="236" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="145" y="234" fill="#555" font-size="11">docker pull</text>
    <rect x="30" y="238" width="200" height="30" rx="5" fill="#fff" stroke="#999"/>
    <text x="130" y="258" text-anchor="middle" fill="#333">inner dockerd (pull, no build)</text>
    <line x1="130" y1="268" x2="130" y2="282" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="30" y="284" width="200" height="26" rx="5" fill="#fff" stroke="#999"/>
    <text x="130" y="302" text-anchor="middle" fill="#333">task container</text>
  </g>

  <!-- ===== Bottom: the one sentence and the switch ===== -->
  <g transform="translate(20,405)">
    <rect width="1160" height="120" rx="8" fill="#fff" stroke="#bbb"/>
    <text x="16" y="24" font-weight="600" fill="#222">The problem in one sentence</text>
    <text x="16" y="46" fill="#333">The provider caches the image it starts the sandbox from. The plan makes that image a generic monitor VM instead of the task image,</text>
    <text x="16" y="64" fill="#333">so for Dockerfile-only tasks the task image is built by a fresh docker daemon inside the sandbox on every trial, on sandbox time you pay for.</text>
    <text x="16" y="92" font-weight="600" fill="#222">Compose tasks are unaffected.</text>
    <text x="210" y="92" fill="#333">They already build inside a DinD sandbox today (panel 2 is what they do now). Only panel 1 tasks regress.</text>
  </g>

  <!-- ===== Bottom: the routing switch ===== -->
  <g transform="translate(20,545)">
    <rect width="1160" height="195" rx="8" fill="#fff" stroke="#bbb"/>
    <text x="16" y="24" font-weight="600" fill="#222">Routing today, one boolean, already computed twice</text>
    <text x="16" y="46" fill="#333" font-family="ui-monospace, Menlo, monospace" font-size="12">compose_mode = (environment_dir / "docker-compose.yaml").exists() or bool(extra_docker_compose)</text>
    <text x="16" y="64" fill="#666" font-size="11">harbor/environments/modal.py:1004 picks _ModalDinD vs _ModalDirect. oddish/workers/harbor/runner.py:978 computes the same as uses_compose.</text>
    <text x="16" y="82" fill="#666" font-size="11">Computed from the task directory on disk after fetch. Not a DB column, which is why the prod count needs a script over task manifests.</text>

    <text x="16" y="112" font-weight="600" fill="#222">Existing prebuilt hook (Option B's sandbox side is already written)</text>
    <text x="16" y="134" fill="#333" font-family="ui-monospace, Menlo, monospace" font-size="12">should_use_prebuilt_docker_image(...)  # harbor/environments/definition.py:26, true when task.toml sets docker_image</text>
    <text x="16" y="152" fill="#666" font-size="11">DinD then uses docker-compose-prebuilt.yaml and pulls instead of building. Missing piece for B is only the build-and-push pipeline and a registry the sandbox can pull from.</text>
    <text x="16" y="178" fill="#a02020" font-size="12" font-weight="600">Open: does a registry exist today, and do any tasks already set docker_image? (grep task manifests)</text>
  </g>
</svg>
