<svg width="1000" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" style="min-width:860px"><style>:root{
  --bg:#fbfcf9; --surface:#ffffff; --surface-2:#eef1f1; --line:#e4e8dc; --ink:#20261d; --ink-soft:#4c5a59; --ink-faint:#7b8786;
  --accent:#1f6f78; --sweep:#6a4bb0; --ok:#1d7a46; --warn:#9a6200; --bad:#a8322f;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px; --radius:6px;
}@media (prefers-color-scheme:dark){:root{
  --bg:#131611; --surface:#1a1e17; --surface-2:#1d2626; --line:#2e3528; --ink:#e9ede3; --ink-soft:#a9b6b5; --ink-faint:#74807f;
  --accent:#6fc3cc; --sweep:#b9a2f5; --ok:#5fcf8c; --warn:#e0a64a; --bad:#f08a86;}}text{font-family:system-ui,sans-serif}</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--accent)" stroke-width="1.6"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--bad)" stroke-width="1.6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ok)" stroke-width="1.6"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--warn)" stroke-width="1.6"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--sweep)" stroke-width="1.6"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="1.6"/></marker><marker id="m-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"/></marker><filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="300"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></defs><g fill="currentColor"><line x1="40" y1="90" x2="960" y2="90" stroke="currentColor" stroke-width="1.2"/><circle cx="90" cy="90" r="6" fill="var(--accent)"/><text x="90" y="70" font-size="12" text-anchor="middle" fill="var(--accent)" font-weight="700">claim + prepare</text><circle cx="280" cy="90" r="6" fill="var(--accent)"/><text x="280" y="70" font-size="12" text-anchor="middle" fill="var(--accent)" font-weight="700">create sandbox</text><circle cx="470" cy="90" r="6" fill="var(--accent)"/><text x="470" y="70" font-size="12" text-anchor="middle" fill="var(--accent)" font-weight="700">persist handle</text><circle cx="660" cy="90" r="6" fill="var(--accent)"/><text x="660" y="70" font-size="12" text-anchor="middle" fill="var(--accent)" font-weight="700">monitor ACK</text><circle cx="850" cy="90" r="6" fill="var(--accent)"/><text x="850" y="70" font-size="12" text-anchor="middle" fill="var(--accent)" font-weight="700">exit: HANDED OFF</text><path d="M185 140 L185 98" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><circle cx="185" cy="152" r="9" fill="var(--surface)" stroke="var(--bad)" stroke-width="1.6"/><text x="185" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="var(--bad)">A</text><text x="185" y="178" font-size="11.5" text-anchor="middle" fill="var(--bad)" font-weight="700">before creation</text><text x="185" y="196" font-size="11" text-anchor="middle" fill="var(--ink-soft)">no sandbox. Existing</text><text x="185" y="211" font-size="11" text-anchor="middle" fill="var(--ink-soft)">fail path, slot freed.</text><path d="M375 140 L375 98" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><circle cx="375" cy="152" r="9" fill="var(--surface)" stroke="var(--bad)" stroke-width="1.6"/><text x="375" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="var(--bad)">B</text><text x="375" y="178" font-size="11.5" text-anchor="middle" fill="var(--bad)" font-weight="700">created, handle not saved</text><text x="375" y="196" font-size="11" text-anchor="middle" fill="var(--ink-soft)">BOUNDED, not recovered:</text><text x="375" y="211" font-size="11" text-anchor="middle" fill="var(--ink-soft)">untracked until the explicit</text><text x="375" y="226" font-size="11" text-anchor="middle" fill="var(--ink-soft)">provider timeout. Test: slot,</text><text x="375" y="241" font-size="11" text-anchor="middle" fill="var(--ink-soft)">retry does not collide.</text><path d="M565 140 L565 98" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><circle cx="565" cy="152" r="9" fill="var(--surface)" stroke="var(--bad)" stroke-width="1.6"/><text x="565" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="var(--bad)">C</text><text x="565" y="178" font-size="11.5" text-anchor="middle" fill="var(--bad)" font-weight="700">handle saved, no ACK</text><text x="565" y="196" font-size="11" text-anchor="middle" fill="var(--ink-soft)">launch failure after build</text><text x="565" y="211" font-size="11" text-anchor="middle" fill="var(--ink-soft)">timeout: existing fail path</text><text x="565" y="226" font-size="11" text-anchor="middle" fill="var(--ink-soft)">+ teardown by handle.</text><path d="M755 140 L755 98" fill="none" stroke="var(--bad)" stroke-width="1.8" filter="url(#rough)" marker-end="url(#m-red)"/><circle cx="755" cy="152" r="9" fill="var(--surface)" stroke="var(--bad)" stroke-width="1.6"/><text x="755" y="156" font-size="11" font-weight="700" text-anchor="middle" fill="var(--bad)">D</text><text x="755" y="178" font-size="11.5" text-anchor="middle" fill="var(--bad)" font-weight="700">after ACK</text><text x="755" y="196" font-size="11" text-anchor="middle" fill="var(--ink-soft)">monitor owns the run.</text><text x="755" y="211" font-size="11" text-anchor="middle" fill="var(--ink-soft)">Launcher death changes</text><text x="755" y="226" font-size="11" text-anchor="middle" fill="var(--ink-soft)">nothing; sweep covers it.</text></g></svg>